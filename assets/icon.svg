<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- LLM Leaderboards: a podium with a star on the winner's step, monochrome (e-ink friendly) -->
  <rect width="512" height="512" rx="112" fill="#000"/>
  <!-- podium steps: 2nd, 1st, 3rd -->
  <rect x="88" y="264" width="104" height="160" rx="12" fill="#fff"/>
  <rect x="204" y="184" width="104" height="240" rx="12" fill="#fff"/>
  <rect x="320" y="312" width="104" height="112" rx="12" fill="#fff"/>
  <!-- ranks -->
  <text x="140" y="352" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" text-anchor="middle" fill="#000">2</text>
  <text x="256" y="312" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="700" text-anchor="middle" fill="#000">1</text>
  <text x="372" y="392" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle" fill="#000">3</text>
  <!-- star above the winner -->
  <polygon points="256,72 275,122 328,124 286,156 301,208 256,178 211,208 226,156 184,124 237,122" fill="#fff"/>
  <!-- base line -->
  <rect x="72" y="436" width="368" height="16" rx="8" fill="#fff"/>
</svg>
