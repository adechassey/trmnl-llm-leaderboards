ring-ai-ability-to-complete-long-tasks/,,,,recmuexxjm6ucxXtH\ngpt-oss-120b,41.983451,0.56634,2025-08-05,OpenAI,United States of America,4.94e+24,\"\"\"The training run for gpt-oss-120b required 2.1 million H100-hours to complete\"\"\n(2.1e6 hours)*(1,979 H100 FLOP/s)*(30% utilization)*(60*60) = 4.49e24\nThey also do post training similar to o3, which we assume adds at least 10% as much compute, so we multiply this estimate by 1.1 to get 4.94e24\n\n\",81.505677,18.79454,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,rec2VBZIfOKcr9NeL\no1-2024-12-17_medium,38.831588,0.510512,2024-12-17,OpenAI,United States of America,,,64.95249,21.164512,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,7.090121,METR-Horizon-v1.1,recrH7UpKH2XmiFW8\ngemini-2.5-pro-preview-06-05,38.734274,0.5544,2025-06-05,Google DeepMind,United States of America,,Flagship model from a leading developer in mid-2025; very likely it used >1e25 FLOP.,69.556192,19.317217,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,recxHthxDmMulkuth\nDeepSeek-R1-0528,31.167847,0.537826,2025-05-28,DeepSeek,China,4.020010000000001e+24,\"Estimates by Ege Erdil in Gradient Updates:\nhttps://epoch.ai/gradient-updates/what-went-into-training-deepseek-r1\n\"\"A dataset size of 14.8 trillion tokens is reasonable and in line with other models of this scale. Assuming that’s valid, the pretraining of this model would have required 6 * (37 billion) * (14.8 trillion) = 3e24 FLOP. If we assume DeepSeek’s training cluster consists of H800s with the PCIe form factor, then each should be capable of 1.5e15 FP8 per second, and the implied model FLOP utilization (MFU) of DeepSeek v3’s 55 day training run ends up being around 23%.\"\"\n\n6 FLOP/token/param * 14.8T tokens * 37B active params = 3.29e24 FLOP (pretraining)\n1.2e23 FLOP (post-training)\n6.1e23 FLOP (fine-tuning)\n\nTotal compute: 3.29e24 + 1.2e23 + 6.1e23 = 4.02e24\",64.108861,12.849837,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,recasKfxLMpd8pTjF\nDeepSeek-R1,26.932599,0.519251,2025-01-20,DeepSeek,China,3.5e+24,\"3.29e24 + 1.8e23 = 3.47e24, round to 3.5e24 due to lack of sigfigs\",50.97746,13.478936,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,rectWm0PAizmHcDik\nDeepSeek-V3-0324,23.117113,0.495813,2025-03-24,DeepSeek,China,3.3e+24,\"6 × 37B × 14.8T = 3.29e24 pretraining FLOPs, 1e22 posttrainining FLOPs - see doc below\n\nhttps://docs.google.com/document/d/1C4zBvHh4UNnzaorwQSdG61zQJsBV9X3i3A70NeelxHY/edit?usp=sharing\",41.333511,11.71071,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,rec5tXt66EEIgBcLi\nclaude-3-5-sonnet-20241022,20.522872,0.452356,2024-10-22,Anthropic,United States of America,,,40.82028,10.144026,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,2.595677,METR-Horizon-v1.1,recM2JJhzA3vJAZoZ\no1-preview-2024-09-12,20.326586,0.451441,2024-09-12,OpenAI,United States of America,,,33.379877,11.716193,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,4.420545,METR-Horizon-v1.1,recJhENih6N50V43Q\nDeepSeek-V3,18.472532,0.473627,2024-12-26,DeepSeek,China,3.3e+24,\"6 × 37B × 14.8T = 3.29e24 pretraining FLOPs, 1e22 posttrainining FLOPs - see doc below\n\nhttps://docs.google.com/document/d/1C4zBvHh4UNnzaorwQSdG61zQJsBV9X3i3A70NeelxHY/edit?usp=sharing\",33.772933,8.967316,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,rec3j0U1Ecav7Q1FA\nclaude-3-5-sonnet-20240620,11.395377,0.401502,2024-06-20,Anthropic,United States of America,2.700000000000001e+25,\"Blog post by Dario Amodei includes some info on 3.5 Sonnet compute: https://darioamodei.com/on-deepseek-and-export-controls\n\"\"Claude 3.5 Sonnet is a mid-sized model that cost a few $10M's to train (I won't give an exact number). Also, 3.5 Sonnet was not trained in any way that involved a larger or more expensive model (contrary to some rumors).\"\"\n\nUsing assumptions about GPU pricing, this lets us estimate compute. https://docs.google.com/spreadsheets/d/1-p-ab6t6dkUM6T7GwnFp85ePTMpZMW7LFY7fW2t8POs/\",22.384214,5.489734,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,1.671757,METR-Horizon-v1.1,rec3I5CcPGjF3Riat\ngpt-4o-2024-11-20,9.17045,0.407636,2024-11-20,OpenAI,United States of America,,Training compute estimated to be 3.8e25 FLOP from benchmark scores. https://colab.research.google.com/drive/1r3pUMhB7Kh0Gls9eG-v_XefWrye9fVQR?usp=sharing,17.963859,4.224241,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,recdwVn3QiDENdt6P\ngpt-4o-2024-08-06,6.991195,0.338424,2024-08-06,OpenAI,United States of America,,Training compute estimated to be 3.8e25 FLOP from benchmark scores. https://colab.research.google.com/drive/1r3pUMhB7Kh0Gls9eG-v_XefWrye9fVQR?usp=sharing,12.414331,3.851599,,,,1.267009,METR-Horizon-v1.1,recj2X3OPdvSriHwy\ngpt-4-turbo-2024-04-09,6.567339,0.367357,2024-04-09,OpenAI,United States of America,,Training compute estimated to be 2.2e25 FLOP using benchmark imputation. https://colab.research.google.com/drive/1r3pUMhB7Kh0Gls9eG-v_XefWrye9fVQR?usp=sharing,12.196509,3.215761,METR - Measuring AI Ability to Complete Long Tasks,https://me