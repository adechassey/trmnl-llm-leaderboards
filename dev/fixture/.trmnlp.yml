t/docs/leaderboards/#polyglot-leaderboard,,,,reck399Bumr5Uaml4\ngrok-4-0709_high,79.6,2025-07-09,xAI,United States of America,5.0000000000001e+26,\"We think that RL relative to pre-compute is between our estimate for o3 (10% of pre-training) and the 100% implied by this slide in the launch ( https://archive.is/f0vJU ). Assuming the same pre-training as Grok 3 (also implied by that slide, and much more consistent) and that Grok 3 used a tenth as much RL, we get:\n\n2 * (grok3/1.1) in the high case (rl is 10% of grok 3, so grok3/1.1 is grok3 precompute, and in this case twice that is grok 4)\n1.1 * (grok3/1.01) in the low case\nThe geometric mean is (rounded to one sig fig): 5e26\n\",97.3,diff,59.6182,https://aider.chat/docs/leaderboards/,,,403.2,2025-07-11,recIX9qqNMX5p7YUh\ngemini-2.5-pro-preview-06-05,79.1,2025-06-05,Google DeepMind,United States of America,,Flagship model from a leading developer in mid-2025; very likely it used >1e25 FLOP.,100.0,diff-fenced,45.5961,https://aider.chat/docs/leaderboards/,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,No thinking parameter set; default thinking token length,175.2,2025-06-06,rectI2Vulkqa1ab26\n,78.2,,,,,,100.0,architect,0.078,Aider LLM Leaderboards,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,Model version deliberately omitted because it's a mix of o3 (high) & gpt-4.1,,,recFWD297UQP8MRYi\no3-2025-04-16_medium,76.9,2025-04-16,OpenAI,United States of America,,,93.8,diff,0.061,Aider LLM Leaderboards,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,,,,rec6DP0rm1WZjXNb1\ngemini-2.5-pro-preview-05-06,76.9,2025-05-06,Google DeepMind,United States of America,,Flagship model from a leading developer in mid-2025; very likely it used >1e25 FLOP.,97.3,diff-fenced,37.4104,https://aider.chat/docs/leaderboards/,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,,165.3,2025-05-07,recQXuPMHsN1f1pXT\no3-2025-04-16_unknown,76.9,2025-04-16,OpenAI,United States of America,,,93.8,diff,13.7517,ht