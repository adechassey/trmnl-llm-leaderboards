parameter count is 10-30B. This would require >55T tokens to reach 10^25 FLOP at the large size, i.e. well beyond 10x overtraining relative to Chinchilla.\",90.7,diff,19.6399,https://aider.chat/docs/leaderboards/,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,,176.5,2025-04-16,recl9fv7t1P1NNdYa\nDeepSeek-R1-0528,71.4,2025-05-28,DeepSeek,China,4.020010000000001e+24,\"Estimates by Ege Erdil in Gradient Updates:\nhttps://epoch.ai/gradient-updates/what-went-into-training-deepseek-r1\n\"\"A dataset size of 14.8 trillion tokens is reasonable and in line with other models of this scale. Assuming that’s valid, the pretraining of this model would have required 6 * (37 billion) * (14.8 trillion) = 3e24 FLOP. If we assume DeepSeek’s training cluster consists of H800s with the PCIe form factor, then each should be capable of 1.5e15 FP8 per second, and the implied model FLOP utilization (MFU) of DeepSeek v3’s 55 day training run ends up being around 23%.\"\"\n\n6 FLOP/token/param * 14.8T tokens * 37B active params = 3.29e24 FLOP (pretraining)\n1.2e23 FLOP (post-training)\n6.1e23 FLOP (fine-tuning)\n\nTotal compute: 3.29e24 + 1.2e23 + 6.1e23 = 4.02e24\",94.6,diff,4.8016,https://aider.chat/docs/leaderboards/,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,,716.6,2025-06-06,recRvk7ngoGy8aCj2\nclaude-opus-4-20250514,70.7,2025-05-22,Anthropic,United States of America,,Flagship model from a leading developer in mid-2025; very likely it used >1e25 FLOP.,98.7,diff,68.6253,https://aider.chat/docs/leaderboards/,https://aider.chat/docs/leaderboards/#polyglot-leaderboard,,42.5,2025-05-25,recRkLNIObleDWFSd\nDeepSeek-V3.2-Exp,70.2,2025-09-29,DeepSeek,China,4.18e+24,\"3.594058e+24 FLOP [base model] + 2.095014e+23 FLOP = 3.8035594e+24 FLOP for pre-training plus continued pre-training\n\nThen, \"\"this framework allocates a\npost-training computational budget exceeding 10% of the pre-training cost\"\", so 4.18e24\",98.2,diff,0.0039,Aider LLM Leaderboards,https://aider.chat