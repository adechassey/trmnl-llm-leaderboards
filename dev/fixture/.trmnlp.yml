e-opus-4-1-20250805_16K,113.68507,0.668069,2025-08-05,Anthropic,United States of America,,,209.192356,57.552638,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,recuz9bui4PgiPuGH\ngrok-4-0709,110.075251,0.665803,2025-07-09,xAI,United States of America,5.0000000000001e+26,\"We think that RL relative to pre-compute is between our estimate for o3 (10% of pre-training) and the 100% implied by this slide in the launch ( https://archive.is/f0vJU ). Assuming the same pre-training as Grok 3 (also implied by that slide, and much more consistent) and that Grok 3 used a tenth as much RL, we get:\n\n2 * (grok3/1.1) in the high case (rl is 10% of grok 3, so grok3/1.1 is grok3 precompute, and in this case twice that is grok 4)\n1.1 * (grok3/1.01) in the low case\nThe geometric mean is (rounded to one sig fig): 5e26\n\",231.836562,48.190843,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,recBhYPAeAQhBoGGs\nclaude-opus-4-1-20250805,100.472004,0.615713,2025-08-05,Anthropic,United States of America,,,158.015405,60.105845,,,,23.455761,METR-Horizon-v1.1,recwfbaxTfx9WUyj1\nclaude-opus-4-20250514_unknown,100.366123,0.615452,2025-05-22,Anthropic,United States of America,,Flagship model from a leading developer in mid-2025; very likely it used >1e25 FLOP.,163.28087,60.36877,,,,20.429752,METR-Horizon-v1.1,recQ05iSph25jn01x\no3-2025-04-16_medium,91.271355,0.654376,2025-04-16,OpenAI,United States of America,,,163.132889,45.62758,METR - Measuring AI Ability to Complete Long Tasks,https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/,,,,recFSX9NsirVMms25\nclaude-opus-4-20250514_16K,85.556627,0.639292,2025-05-22,Anthropic,United States of America,,Flagship model from a leading developer in mid-2025; very likely it used >1e25 FLOP.,146.803709,45.062156,METR - Measuring AI Ability to Complete Long Tasks,https: